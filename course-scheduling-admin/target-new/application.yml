server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: course-scheduling-admin
  sql:
    init:
      mode: never
  
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/course_scheduling?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: root123456
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      pool-name: CourseSchedulingHikariCP
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  data:
    redis:
      host: localhost
      port: 6379
      password: 
      database: 0
      timeout: 10000ms
      lettuce:
        pool:
          min-idle: 0
          max-idle: 8
          max-active: 8
          max-wait: -1ms

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.paike.admin.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
    banner: false
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    call-setters-on-nulls: true
    jdbc-type-for-null: 'null'
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: paike-scheduling-system-secret-key-2024-very-long-secret-key
  expiration: 86400000

logging:
  level:
    com.paike: debug
    org.springframework: info
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'

knife4j:
  enable: true
  setting:
    language: zh_cn
    swagger-model-name: 实体类列表

algorithm:
  genetic:
    population-size: 100
    max-generations: 500
    crossover-rate: 0.8
    mutation-rate: 0.15
    elite-count: 10
    target-fitness: 0.95
    max-no-improvement-generations: 50
  greedy:
    enable-local-backtrack: true
    max-backtrack-depth: 3
    max-retry-attempts: 10
